<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dijkstra Algorithm Visualizer</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#0d1117;
color:white;
font-family:Arial,sans-serif;
min-height:100vh;
display:flex;
flex-direction:column;
align-items:center;
padding:40px 20px;
}

h1{
font-size:42px;
margin-bottom:10px;
}

.subtitle{
color:#9ca3af;
margin-bottom:30px;
text-align:center;
max-width:700px;
line-height:1.6;
}

.controls{
display:flex;
gap:16px;
flex-wrap:wrap;
justify-content:center;
margin-bottom:30px;
}

select,button{
padding:12px 20px;
border:none;
border-radius:10px;
font-size:15px;
}

select{
background:#1f2937;
color:white;
}

button{
background:#22c55e;
color:black;
font-weight:bold;
cursor:pointer;
transition:0.2s;
}

button:hover{
transform:translateY(-2px);
}

#graph{
position:relative;
width:900px;
height:600px;
background:#111827;
border-radius:20px;
border:1px solid #1f2937;
overflow:hidden;
}

.node{
position:absolute;
width:60px;
height:60px;
border-radius:50%;
background:#1f2937;
border:3px solid #374151;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
font-size:18px;
transition:0.4s;
z-index:2;
}

.node.visited{
background:#2563eb;
border-color:#60a5fa;
transform:scale(1.1);
}

.node.path{
background:#22c55e;
border-color:#86efac;
color:black;
transform:scale(1.15);
}

.edge{
position:absolute;
height:4px;
background:#374151;
transform-origin:left center;
z-index:1;
transition:0.4s;
}

.edge.active{
background:#22c55e;
height:5px;
}

.weight{
position:absolute;
font-size:14px;
color:#facc15;
background:#0d1117;
padding:2px 6px;
border-radius:6px;
z-index:3;
}

.result-box{
margin-top:30px;
padding:20px;
background:#111827;
border:1px solid #1f2937;
border-radius:14px;
width:900px;
}

.result-title{
font-size:20px;
margin-bottom:12px;
}

.result-text{
color:#d1d5db;
line-height:1.7;
}

@media(max-width:950px){

#graph{
width:100%;
height:500px;
}

.result-box{
width:100%;
}

}

</style>
</head>

<body>

<h1>Dijkstra Algorithm Visualizer</h1>

<p class="subtitle">
Interactive shortest path visualization using graph theory and Dijkstra’s Algorithm.
Select a source and destination node to compute the shortest route dynamically.
</p>

<div class="controls">

<select id="source">
<option value="A">Source: A</option>
<option value="B">Source: B</option>
<option value="C">Source: C</option>
<option value="D">Source: D</option>
<option value="E">Source: E</option>
<option value="F">Source: F</option>
</select>

<select id="destination">
<option value="A">Destination: A</option>
<option value="B">Destination: B</option>
<option value="C">Destination: C</option>
<option value="D">Destination: D</option>
<option value="E">Destination: E</option>
<option value="F">Destination: F</option>
</select>

<button onclick="runDijkstra()">
Run Algorithm
</button>

<button onclick="resetGraph()">
Reset
</button>

</div>

<div id="graph"></div>

<div class="result-box">

<div class="result-title">
Algorithm Output
</div>

<div class="result-text" id="result">
Select nodes and run the algorithm.
</div>

</div>

<script>

const graphElement=document.getElementById("graph");

const nodes={
A:{x:80,y:250},
B:{x:260,y:100},
C:{x:500,y:120},
D:{x:260,y:400},
E:{x:550,y:380},
F:{x:760,y:250}
};

const edges=[
["A","B",4],
["A","D",2],
["B","C",5],
["B","D",1],
["C","F",6],
["D","E",8],
["E","F",2],
["C","E",3]
];

const adjacency={};

for(const node in nodes){
adjacency[node]=[];
}

edges.forEach(([a,b,w])=>{
adjacency[a].push({node:b,weight:w});
adjacency[b].push({node:a,weight:w});
});

function createGraph(){

graphElement.innerHTML="";

edges.forEach(([a,b,w],index)=>{

const x1=nodes[a].x+30;
const y1=nodes[a].y+30;

const x2=nodes[b].x+30;
const y2=nodes[b].y+30;

const length=Math.hypot(x2-x1,y2-y1);

const angle=Math.atan2(y2-y1,x2-x1)*180/Math.PI;

const edge=document.createElement("div");

edge.className="edge";
edge.id="edge-"+a+b;

edge.style.width=length+"px";
edge.style.left=x1+"px";
edge.style.top=y1+"px";
edge.style.transform=`rotate(${angle}deg)`;

graphElement.appendChild(edge);

const label=document.createElement("div");

label.className="weight";
label.innerText=w;

label.style.left=((x1+x2)/2)+"px";
label.style.top=((y1+y2)/2)+"px";

graphElement.appendChild(label);

});

for(const key in nodes){

const node=document.createElement("div");

node.className="node";
node.id="node-"+key;

node.innerText=key;

node.style.left=nodes[key].x+"px";
node.style.top=nodes[key].y+"px";

graphElement.appendChild(node);

}

}

createGraph();

function resetGraph(){

document.querySelectorAll(".node").forEach(node=>{
node.classList.remove("visited","path");
});

document.querySelectorAll(".edge").forEach(edge=>{
edge.classList.remove("active");
});

document.getElementById("result").innerHTML=
"Select nodes and run the algorithm.";

}

async function runDijkstra(){

resetGraph();

const source=document.getElementById("source").value;
const destination=document.getElementById("destination").value;

const distances={};
const previous={};
const visited={};

for(const node in nodes){
distances[node]=Infinity;
previous[node]=null;
visited[node]=false;
}

distances[source]=0;

while(true){

let current=null;
let shortest=Infinity;

for(const node in distances){

if(!visited[node] && distances[node]<shortest){

shortest=distances[node];
current=node;

}

}

if(current===null) break;

visited[current]=true;

document.getElementById("node-"+current)
.classList.add("visited");

await sleep(600);

if(current===destination) break;

for(const neighbor of adjacency[current]){

const distance=
distances[current]+neighbor.weight;

if(distance<distances[neighbor.node]){

distances[neighbor.node]=distance;

previous[neighbor.node]=current;

}

}

}

const path=[];

let current=destination;

while(current){

path.unshift(current);
current=previous[current];

}

for(let i=0;i<path.length;i++){

document.getElementById("node-"+path[i])
.classList.add("path");

if(i<path.length-1){

const a=path[i];
const b=path[i+1];

const edge1=document.getElementById("edge-"+a+b);
const edge2=document.getElementById("edge-"+b+a);

if(edge1) edge1.classList.add("active");
if(edge2) edge2.classList.add("active");

}

await sleep(500);

}

document.getElementById("result").innerHTML=`

<strong>Source:</strong> ${source}<br>
<strong>Destination:</strong> ${destination}<br>
<strong>Shortest Distance:</strong> ${distances[destination]}<br>
<strong>Path:</strong> ${path.join(" → ")}

`;

}

function sleep(ms){
return new Promise(resolve=>setTimeout(resolve,ms));
}

</script>

</body>
</html>
